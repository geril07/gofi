[workspace]
resolver = "3"
members = ["crates/gofi-core", "crates/gofi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3"
fs2 = "0.4"
shell-words = "1"
tempfile = "3"
